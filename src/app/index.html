<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion Builder</title>
    <script>
      // Theme is view state (uiStore). Apply it before first paint so the page doesn't flash.
      try { if (localStorage.getItem("mb.theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
